<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Apontamento{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <h1>Apontamento — Repasse Robô</h1>
    <nav>
      <a href="{{ url_for('repasse.index') }}" class="{{ 'ativo' if request.endpoint == 'repasse.index' }}">Repasses</a>
      <a href="{{ url_for('repasse.analise') }}" class="{{ 'ativo' if request.endpoint == 'repasse.analise' }}">Análise</a>
      <a href="{{ url_for('repasse.cadastros') }}" class="{{ 'ativo' if request.endpoint == 'repasse.cadastros' }}">Cadastros</a>
    </nav>
  </header>
  <main>
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for categoria, msg in mensagens %}
        <div class="alerta {{ categoria }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
